name: BG Hugo CI/CD
on:
  push:
    branches:
      - main
  pull_request:
  # Nightly, so the Sprechzeit numbers (worked out from the transcripts on
  # download.binaergewitter.de at build time) pick up corrected or late
  # transcripts without a commit. 04:17 UTC, off the full hour.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test Hugo Build
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.154.2'
          extended: true
      
      - name: Build site
        run: hugo --minify
      
      - name: Compress search index
        run: gzip -k public/index.json
      
      - name: Run tests
        run: node tests/test.js

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Fly.io
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
